    years: [2021, 2022, 2023, 2024]
    caveats:
      - "Teens who answered \"I'm not sure\" or \"I don't want to answer\" are counted as no, as in SAMHSA's published estimates."
      - Beginning in 2022 the teen suicide questions were moved to a different section of the interview, which may affect comparisons with 2021.
    codebook: YUSUIPLNYR
    status: launch

