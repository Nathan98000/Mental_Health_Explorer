# Indicator catalog. Every code is taken from the combined 2021-2024 NSDUH PUF codebook
# (nsduh-2021_2024-ds0001-info-codebook_v1.pdf); validation/ checks the codes and the
# unweighted frequencies against it. `yes`/`no` are the source codes that become 1/0;
# every other value (blank = out of universe, -9 = not collected that year, 85-99 = item
# nonresponse) is missing. `universe` restricts the denominator. `years` are the years
# the item was collected, checked against the data. Ids are unique within a cohort; the
# same id in both cohorts means the same concept measured by that cohort's item.
indicators:
  # ============================ Teens (ages 12-17) ============================
  # ---- Depression and suicide ----
  - id: mde_py
    cohort: teen
    topic: depression_suicide
    label: Major depressive episode in the past year
    phrase: had a major depressive episode in the past year
    definition: >-
      Had a period of at least two weeks in the past 12 months with a depressed mood or
      loss of interest or pleasure in daily activities, plus most of the other symptoms of
      depression, based on DSM criteria.
    source: YMDEYR
    "yes": [1]
    "no": [2]
    years: [2021, 2022, 2023, 2024]
    caveats: []
    codebook: YMDEYR
    status: launch

  - id: mde_lifetime
    cohort: teen
    topic: depression_suicide
    label: Major depressive episode at some point in life
    phrase: have had a major depressive episode at some point in their life
    definition: >-
      Ever had a period of at least two weeks with a depressed mood or loss of interest or
      pleasure in daily activities, plus most of the other symptoms of depression, based on
      DSM criteria.
    source: YMDELT
    "yes": [1]
    "no": [2]
    years: [2021, 2022, 2023, 2024]
    caveats: []
    codebook: YMDELT
    status: launch

  - id: mde_severe
    cohort: teen
    topic: depression_suicide
    label: Major depressive episode with severe impairment
    phrase: had a major depressive episode with severe impairment in the past year
    definition: >-
      Had a major depressive episode in the past year that severely interfered with chores
      at home, school or work, family relationships, or social life (Sheehan Disability
      Scale). The denominator is all teens.
    source: MDEIMPY
    "yes": [1]
    "no": [2]
    years: [2021, 2022, 2023, 2024]
    caveats: []
    codebook: MDEIMPY
    status: launch

  - id: suicide_thoughts
    cohort: teen
    topic: depression_suicide
    label: Seriously thought about suicide in the past year
    phrase: seriously thought about killing themselves in the past year
    definition: Seriously thought about trying to kill themselves at any time in the past 12 months.
    source: YUSUITHKYR
    "yes": [1]
    "no": [2, 3, 4]
    years: [2021, 2022, 2023, 2024]
    caveats:
      - "Teens who answered \"I'm not sure\" or \"I don't want to answer\" are counted as no, as in SAMHSA's published estimates."
      - Beginning in 2022 the teen suicide questions were moved to a different section of the interview, which may affect comparisons with 2021.
    codebook: YUSUITHKYR
    status: launch

  - id: suicide_plan
    cohort: teen
    topic: depression_suicide
    label: Made a suicide plan in the past year
    phrase: made a plan to kill themselves in the past year
    definition: Made any plans to kill themselves in the past 12 months.
    source: YUSUIPLNYR
    "yes": [1]
