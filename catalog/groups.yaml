# Breakdown groups. Codes come from the combined 2021-2024 PUF codebook. Respondents whose
# source code is not listed under any level (e.g. POVERTY3 blank for college dorm residents,
# IMOTHER/IFATHER = 3 "don't know") get a missing group value.
#
# `phrase` is the population wording for takeaways ("About 1 in 7 female teens ages 12–17 ...").
# It is a template: {cohort} is the cohort phrase ("teens ages 12–17", "young adults ages 18–25"),
# {people} the short form ("teens", "young adults") and {level} the level label. A level's own
# `phrase` replaces the group template for that level. Adjectives before the noun keep the ages
# ("female teens ages 12–17"); qualifiers after it use the short form ("teens living with one parent").
groups:
  - id: age_band
    label: Age
    source: AGE3
    cohorts: [teen, young_adult]
    phrase: "{people} ages {level}"
    levels:
      - { id: age_12_13, label: "12–13", codes: [1] }
      - { id: age_14_15, label: "14–15", codes: [2] }
      - { id: age_16_17, label: "16–17", codes: [3] }
      - { id: age_18_20, label: "18–20", codes: [4] }
      - { id: age_21_23, label: "21–23", codes: [5] }
      - { id: age_24_25, label: "24–25", codes: [6] }

  - id: sex
    label: Sex
    source: IRSEX
    cohorts: [teen, young_adult]
    phrase: "{level} {cohort}"
    levels:
      - { id: male, label: Male, codes: [1], phrase: "male {cohort}" }
      - { id: female, label: Female, codes: [2], phrase: "female {cohort}" }

  - id: race_ethnicity
    label: Race and ethnicity
    source: NEWRACE2
    cohorts: [teen, young_adult]
    phrase: "{level} {cohort}"
    levels:
      - { id: white, label: White (non-Hispanic), codes: [1], phrase: "non-Hispanic white {cohort}" }
      - { id: black, label: Black (non-Hispanic), codes: [2], phrase: "non-Hispanic Black {cohort}" }
      - { id: aian, label: American Indian or Alaska Native (non-Hispanic), codes: [3], phrase: "non-Hispanic American Indian or Alaska Native {cohort}" }
      - { id: nhopi, label: Native Hawaiian or Pacific Islander (non-Hispanic), codes: [4], phrase: "non-Hispanic Native Hawaiian or Pacific Islander {cohort}" }
      - { id: asian, label: Asian (non-Hispanic), codes: [5], phrase: "non-Hispanic Asian {cohort}" }
      - { id: multiracial, label: Two or more races (non-Hispanic), codes: [6], phrase: "non-Hispanic multiracial {cohort}" }
      - { id: hispanic, label: Hispanic or Latino, codes: [7], phrase: "Hispanic or Latino {cohort}" }

  - id: race_ethnicity_5
    label: Race and ethnicity (5 groups)
    source: NEWRACE2
    cohorts: [teen, young_adult]
    crosses_only: true
    phrase: "{level} {cohort}"
    levels:
      - { id: white, label: White (non-Hispanic), codes: [1], phrase: "non-Hispanic white {cohort}" }
      - { id: black, label: Black (non-Hispanic), codes: [2], phrase: "non-Hispanic Black {cohort}" }
      - { id: asian, label: Asian (non-Hispanic), codes: [5], phrase: "non-Hispanic Asian {cohort}" }
      - { id: hispanic, label: Hispanic or Latino, codes: [7], phrase: "Hispanic or Latino {cohort}" }
      - { id: another_or_multiracial, label: Another race or multiracial, codes: [3, 4, 6], phrase: "{people} of another race or who are multiracial" }

  - id: poverty
    label: Family income relative to the poverty line
    source: POVERTY3
    cohorts: [teen, young_adult]
    phrase: "{people} in families {level}"
    levels:
      - { id: below_poverty, label: Below the poverty line, codes: [1], phrase: "{people} in families below the poverty line" }
      - { id: up_to_2x_poverty, label: Up to twice the poverty line, codes: [2], phrase: "{people} in families earning up to twice the poverty line" }
      - { id: above_2x_poverty, label: More than twice the poverty line, codes: [3], phrase: "{people} in families earning more than twice the poverty line" }

  - id: family_income
    label: Family income
    source: IRFAMIN3
    cohorts: [teen, young_adult]
    phrase: "{people} in families earning {level}"
    levels:
      - { id: under_20k, label: "Less than $20,000", codes: [1, 2], phrase: "{people} in families earning less than $20,000" }
      - { id: from_20k_to_49k, label: "$20,000–$49,999", codes: [3, 4, 5] }
      - { id: from_50k_to_74k, label: "$50,000–$74,999", codes: [6] }
      - { id: from_75k, label: "$75,000 or more", codes: [7] }

  - id: insurance
    label: Health insurance
    source: IRINSUR4
    cohorts: [teen, young_adult]
    phrase: "{people} ({level})"
    levels:
      - { id: insured, label: Has health insurance, codes: [1], phrase: "{people} with health insurance" }
      - { id: uninsured, label: No health insurance, codes: [2], phrase: "{people} without health insurance" }

  - id: metro
    label: Where they live
    source: COUTYP4
    cohorts: [teen, young_adult]
    phrase: "{people} ({level})"
    levels:
      - { id: large_metro, label: Large metro area, codes: [1], phrase: "{people} in large metro areas" }
      - { id: small_metro, label: Small metro area, codes: [2], phrase: "{people} in small metro areas" }
      - { id: nonmetro, label: Nonmetro (rural) area, codes: [3], phrase: "{people} in nonmetro (rural) areas" }

  - id: parents_in_home
    label: Parents in the home
    source: [IMOTHER, IFATHER]
    cohorts: [teen]
    phrase: "{people} living with {level}"
    levels:
      - { id: both_parents, label: Both parents, codes: [[1, 1]], phrase: "{people} living with both parents" }
      - { id: one_parent, label: One parent, codes: [[1, 2], [2, 1]], phrase: "{people} living with one parent" }
      - { id: neither_parent, label: Neither parent, codes: [[2, 2]], phrase: "{people} living with neither parent" }

  - id: education
    label: Education
    source: EDUHIGHCAT
    cohorts: [young_adult]
    phrase: "{people} ({level})"
    levels:
      - { id: less_than_high_school, label: Less than high school, codes: [1], phrase: "{people} with less than a high school education" }
      - { id: high_school_graduate, label: High school graduate, codes: [2], phrase: "{people} who finished high school but not college" }
      - { id: some_college, label: Some college or associate degree, codes: [3], phrase: "{people} with some college or an associate degree" }
      - { id: college_graduate, label: College graduate, codes: [4], phrase: "{people} who graduated from college" }

  - id: employment
    label: Employment
    source: IRWRKSTAT18
    cohorts: [young_adult]
    phrase: "{people} ({level})"
    levels:
      - { id: full_time, label: Employed full time, codes: [1], phrase: "{people} employed full time" }
      - { id: part_time, label: Employed part time, codes: [2], phrase: "{people} employed part time" }
      - { id: unemployed, label: Unemployed, codes: [3], phrase: "unemployed {cohort}" }
      - { id: not_in_labor_force, label: Other (including students and not in the labor force), codes: [4], phrase: "{people} who are students or otherwise not in the labor force" }
